[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: testes que conectam de verdade nos inversores locais ou Cooperaliança (apenas no Pi)",
]
addopts = "-m 'not live'"
