[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: tests that connect to the real inverters or the Cooperaliança portal (Pi only)",
]
addopts = "-m 'not live' --cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]

[tool.mypy]
python_version = "3.10"
files = ["common.py", "inverters.py", "utility.py"]
# The collector modules import each other as top-level modules (`from common import ...`)
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
# Inverter protocol libraries ship without type information
module = ["goodwe", "goodwe.*", "pysolarmanv5", "pysolarmanv5.*"]
ignore_missing_imports = true
