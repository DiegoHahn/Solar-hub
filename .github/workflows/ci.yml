name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard (lint, typecheck, unit & component tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      # Build requires syntactically valid placeholder values; no pages query Supabase during build.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  collector:
    name: Python Collector (lint, format, pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Minimum supported version (pyproject target) and the version running on the edge device
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            collector/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Builds and installs the collector package itself; its dependencies come from the pins above
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not live"

  integration:
    name: Integration and E2E (Live Supabase, Open-Meteo, Playwright)
    if: github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
      ALLOWED_EMAILS: ${{ secrets.SUPABASE_TEST_EMAIL }}
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}

      - uses: actions/setup-node@v7
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}

      - name: Run Integration Tests with Live Supabase
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}
        run: npm run test:integration -- --coverage --coverage.reporter=text-summary

      - name: Playwright Version
        id: playwright
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The ubuntu-latest image already includes Chromium system libraries; --with-deps would
      # only install extra non-Latin font packages not required by tests.
      - name: Install Chromium for Playwright
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}
        run: npx playwright install chromium

      - name: Build Dashboard for E2E
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}
        run: npm run build

      - name: Run E2E Tests with Playwright
        if: ${{ env.SUPABASE_TEST_EMAIL != '' }}
        run: npm run e2e

  trivy:
    name: Trivy (dependencies, secrets, misconfigurations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  semgrep:
    name: Semgrep (static code analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed from PyPI instead of running in the semgrep/semgrep container,
      # so a Docker Hub pull failure cannot block every pull request.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install semgrep==1.180.0

      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript
          --config p/react
          --config p/nextjs
          --config p/python
          --config p/secrets
