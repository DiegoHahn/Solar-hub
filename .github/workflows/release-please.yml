name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      # O PR de release precisa passar pelos checks obrigatórios do main; PRs abertos com o GITHUB_TOKEN
      # não disparam workflows, por isso o token é de um usuário (fine-grained, só neste repositório).
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
