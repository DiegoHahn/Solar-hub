name: Telemetry Monitoring

on:
  schedule:
    # Every 30 minutes between 09:00 and 22:59 UTC (06:00 to 19:59 BRT - daylight generation window)
    - cron: '*/30 9-22 * * *'
  workflow_dispatch:

concurrency:
  group: monitor-telemetry
  cancel-in-progress: true

jobs:
  check-telemetry:
    name: Verify Telemetry Freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run telemetry health check
        run: npm run telemetry:check
